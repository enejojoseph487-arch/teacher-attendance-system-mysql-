<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Teacher Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        min-height: 100vh;
      }

      header {
        background: #0d6efd;
        color: white;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        font-size: 24px;
      }

      .logout {
        background: white;
        color: #0d6efd;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
      }

      .container {
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
      }

      .welcome {
        margin-bottom: 25px;
      }

      .card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .status {
        font-size: 20px;
        margin: 20px 0;
      }

      button {
        padding: 14px 25px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-size: 16px;
        margin: 5px;
      }

      .sign-in {
        background: #198754;
        color: white;
      }

      .sign-out {
        background: #dc3545;
        color: white;
      }

      #message {
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Teacher Attendance</h1>

      <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="container">
      <div class="welcome">
        <h2 id="welcomeMessage">Welcome, Teacher 👋</h2>

        <p>Manage your attendance for today.</p>
      </div>

      <div class="card">
        <h2>Today's Attendance</h2>

        <p class="status">
          Status:
          <strong id="status">Not Signed In</strong>
        </p>

        <p>
          🟢 Sign In Time:
          <strong id="signInTime">--:--</strong>
        </p>

        <p>
          🔴 Sign Out Time:
          <strong id="signOutTime">--:--</strong>
        </p>

        <button id="signInButton" class="sign-in" onclick="signIn()">
          Sign In
        </button>

        <button id="signOutButton" class="sign-out" onclick="signOut()">
          Sign Out
        </button>
        <p id="message"></p>
      </div>
    </div>

    <script>
      async function signIn() {
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
          alert("Please login first.");
          window.location.href = "/index.html";
          return;
        }

        try {
          const response = await fetch("/attendance/sign-in", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              teacherId: user.id,
            }),
          });

          const data = await response.json();

          // Always show the server's message
          alert(data.message);

          if (data.success) {
            await loadTodayAttendance();
          } else {
            // Refresh attendance information
            await loadTodayAttendance();
          }
        } catch (error) {
          console.log("Sign-in error:", error);

          alert("Unable to connect to the server.");
        }
      }
      async function signOut() {
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
          alert("Please login first.");
          window.location.href = "/index.html";
          return;
        }

        try {
          const response = await fetch("/attendance/sign-out", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              teacherId: user.id,
            }),
          });

          const data = await response.json();

          // Always show the server's message
          alert(data.message);

          await loadTodayAttendance();
        } catch (error) {
          console.log("Sign-out error:", error);

          alert("Unable to connect to the server.");
        }
      }
      const user = JSON.parse(localStorage.getItem("user"));

      if (user) {
        document.getElementById("welcomeMessage").textContent =
          `Welcome, ${user.name}!`;
      }
      async function loadTodayAttendance() {
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
          return;
        }

        try {
          const response = await fetch(
            `/attendance/today/${user.id}?t=${Date.now()}`,
            {
              cache: "no-store",
            },
          );
          const data = await response.json();

          const status = document.getElementById("status");

          const signInButton = document.getElementById("signInButton");
          const signOutButton = document.getElementById("signOutButton");

          if (!data.attendance) {
            status.textContent = "Not Signed In";

            document.getElementById("signInTime").textContent = "--:--";
            document.getElementById("signOutTime").textContent = "--:--";

            signInButton.disabled = false;
            signInButton.textContent = "Sign In";

            signOutButton.disabled = true;

            return;
          }
          status.textContent = data.attendance.status;

          document.getElementById("signInTime").textContent =
            data.attendance.sign_in || "--:--";

          document.getElementById("signOutTime").textContent =
            data.attendance.sign_out || "--:--";

          // Teacher has already signed in
          signInButton.disabled = true;
          signInButton.textContent = "Signed In ✓";

          // Sign out is available only if they haven't signed out yet
          if (data.attendance.sign_out) {
            signOutButton.disabled = true;
            signOutButton.textContent = "Signed Out ✓";
          } else {
            signOutButton.disabled = false;
            signOutButton.textContent = "Sign Out";
          }
        } catch (error) {
          console.log("Attendance error:", error);
        }
      }

      loadTodayAttendance();
    </script>
  </body>
</html>
